    <!DOCTYPE html>
    <html>
    <head>
      <style>
        body {
          background-color: lightgray;
        }

        @media (prefers-bold-text: bold) {
          body {
            background-color: lightgreen;
            font-weight: bold;
          }
        }
      </style>
    </head>
    <body>
      <h1>prefers-bold-text test</h1>
      <p>If bold text is enabled, this background turns green and text becomes bold.</p>
    </body>
    </html>
